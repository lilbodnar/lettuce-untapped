<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTG Tracker</title>
  <meta name="theme-color" content="#15171c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>try { document.documentElement.dataset.accent = localStorage.getItem('mtg-accent') || 'orange'; } catch (e) {}</script>
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="back-btn" data-action="back" title="Go back to the previous page" disabled>◂ Back</button>
    <div class="brand">MTG Tracker</div>
    <nav class="tabs" id="tabs">
      <button data-tab="collection">Collection</button>
      <button data-tab="decks">Decks</button>
      <button data-tab="wishlist">Wishlist</button>
      <button data-tab="prices">Prices</button>
      <button data-tab="import">Import</button>
      <button data-tab="settings">Account &amp; backup</button>
      <!-- The Simulator's pages (shown in #simHost) -->
      <button data-tab="sim-decks" class="sim-tab sim-first" title="Simulator: your games, play against the computer or online, precons and pasted decks">Playtest</button>
      <button data-tab="sim-play" class="sim-tab" title="Simulator: the table">Play</button>
      <button data-tab="sim-odds" class="sim-tab" title="Simulator: opening hands, land drops and draw odds">Odds</button>
      <button data-tab="sim-test" class="sim-tab" title="Simulator: automatic games and deck tests">Auto-test</button>
      <button data-tab="sim-help" class="sim-tab" title="Simulator: how it works">Help</button>
    </nav>
  </header>
  <div id="status" class="status" hidden></div>
  <div id="backupNote" class="status warn" hidden></div>
  <div id="syncNote" class="status warn" hidden></div>
  <main id="view"><div class="empty">Loading…</div></main>
  <!-- The Simulator, kept open (and its game going) while you use the other tabs. -->
  <div id="simHost" class="sim-host" hidden></div>
  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <img id="hoverPreview" class="hover-preview" alt="" hidden>
  <div id="dropHint" class="drop-hint" hidden></div>
  <footer class="foot">Card data, images and prices from <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>. Not affiliated with Wizards of the Coast.</footer>

  <script src="js/parser.js"></script>
  <script src="js/store.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/account.js"></script>
  <script src="js/scryfall.js"></script>
  <script src="js/archidekt.js"></script>
  <script src="js/moxfield.js"></script>
  <script src="js/deckcheck.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
