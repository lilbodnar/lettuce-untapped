<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTG Simulator</title>
  <meta name="theme-color" content="#15171c">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>try { document.documentElement.dataset.accent = localStorage.getItem('mtg-accent') || 'orange'; } catch (e) {}</script>
  <!-- The Simulator is part of MTG Tracker: opened on its own, it goes to the Tracker's Playtest tab
       (which shows it, with every tab). "?standalone" in the address keeps this page on its own. -->
  <script>if (window.parent === window && !/[?&]standalone\b/.test(location.search)) location.replace('../index.html#sim-decks');</script>
</head>
<body>
  <header class="topbar">
    <div class="brand">MTG Simulator</div>
    <nav class="tabs" id="tabs">
      <button data-tab="decks">Decks</button>
      <button data-tab="play">Play</button>
      <button data-tab="odds">Odds</button>
      <button data-tab="test">Auto-test</button>
      <button data-tab="help">Help</button>
      <a class="app-link" href="../index.html" title="Back to your collection">◂ MTG Tracker</a>
    </nav>
    <div class="link-state" id="linkState"></div>
  </header>
  <div id="status" class="status" hidden></div>
  <main id="view"><div class="empty">Loading…</div></main>
  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="menu" class="ctx-menu" hidden></div>
  <div id="ghost" class="drag-ghost" hidden></div>

  <script src="../js/parser.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/scryfall.js"></script>
  <script src="../js/backup.js"></script>
  <script src="js/tracker-link.js"></script>
  <script src="js/game.js"></script>
  <script src="js/odds.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/autoplay.js"></script>
  <script src="js/brackets.js"></script>
  <script src="js/online.js"></script>
  <script src="js/precons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
